
name: nexusdemo

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  WORKDIR: javadocker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ env.WORKDIR }}/pom.xml

      - name: Configure Maven settings.xml for Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <!-- id must match <distributionManagement> repository/snapshotRepository id in pom.xml -->
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
            <mirrors>
              <!-- Overrides Maven's bundled default mirror (same id) that blocks plain-HTTP
                   repositories since Maven 3.8.1, so deploys to the HTTP Nexus above work. -->
              <mirror>
                <id>maven-default-http-blocker</id>
                <mirrorOf>external:http:*</mirrorOf>
                <name>Allow internal HTTP Nexus</name>
                <url>http://0.0.0.0/blocked-by-mirror</url>
                <blocked>false</blocked>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn -B clean verify
        working-directory: ${{ env.WORKDIR }}

      # - name: Deploy to Nexus
      #   run: mvn deploy
      #   working-directory: ${{ env.WORKDIR }}
      #   env:
      #     NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      #     NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Publish jar package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-package
          path: ${{ env.WORKDIR }}/target/*.jar

      - name: Publish JAR to Nexus
        working-directory: ${{ env.WORKDIR }}
        run: mvn -B deploy -DskipTests
